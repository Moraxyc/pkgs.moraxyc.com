name: Update dependencies
on:
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: update-dependencies
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Update locked inputs and module hashes
        run: |
          nix flake update
          nix develop -c just vendor-hash
      - name: Validate updated dependencies
        run: |
          nix flake check
          nix develop -c bash -euo pipefail -c 'just check && just integration && just build'
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit and push updated dependencies
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          git add flake.lock nix/vendor-hash
          if git diff --cached --quiet; then
            echo 'Dependencies already up to date.'
            exit 0
          fi
          bot_name="${APP_SLUG}[bot]"
          bot_id="$(gh api "users/$bot_name" --jq .id)"
          git config user.name "$bot_name"
          git config user.email "${bot_id}+${bot_name}@users.noreply.github.com"
          git commit -F - <<'EOF'
          chore(deps): update Nix inputs and Go module hashes

          Update flake inputs and recompute nix/vendor-hash from go.mod and go.sum.

          Validated with flake checks, just check, just integration, and just build.
          EOF
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"
