name: Update publication
on:
    repository_dispatch:
        types: [project-release-published]
    schedule:
        - cron: "17 */6 * * *"
    workflow_dispatch:
permissions: {}
concurrency:
    group: moraxyc-publication-update
    cancel-in-progress: false
jobs:
    update:
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
        outputs:
            commit: ${{ steps.save.outputs.commit }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false
            - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
            - name: Restore publication Nix cache
              uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
              with:
                primary-key: nix-publication-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix', 'nix/**', 'go.mod', 'go.sum', 'LICENSE', 'cmd/**', 'internal/**', 'schemas/**', 'tests/**') }}
                restore-prefixes-first-match: nix-publication-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
                gc-max-store-size: 1G
            - name: Prepare locked publication tools
              run: |
                  mkdir -p .build
                  nix build .#publication-tools --out-link .build/publication-tools
                  echo "$PWD/.build/publication-tools/bin" >> "$GITHUB_PATH"

            - name: Refresh and validate publication inputs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: moraxyc-repo update-publication
            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  permission-contents: write
            - name: Save publication inputs
              id: save
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -euo pipefail
                  bot_name="${APP_SLUG}[bot]"
                  bot_id="$(gh api "users/$bot_name" --jq .id)"
                  git config user.name "$bot_name"
                  git config user.email "${bot_id}+${bot_name}@users.noreply.github.com"
                  git add publication/snapshot.json publication/context.json
                  if ! git diff --cached --quiet; then
                    git commit -m 'chore(publication): refresh snapshot and epoch'
                  fi
                  gh auth setup-git
                  git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
                  echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    build:
        needs: update
        permissions:
            contents: read
        uses: ./.github/workflows/build.yml
        secrets: inherit
        with:
            source_commit: ${{ needs.update.outputs.commit }}
            publish: true
