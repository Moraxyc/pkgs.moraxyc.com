name: Build
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Sign and publish after building
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      publish:
        type: boolean
        default: false
permissions: {}
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.bundle.outputs.commit }}
      site: ${{ steps.bundle.outputs.site }}
      artifact: ${{ steps.bundle.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build unsigned publication
        run: nix develop .#build -c nix build .#site
      - name: Export publication and runtime closure
        id: bundle
        shell: result/tools/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          export PATH="$PWD/result/tools/bin:$PATH"
          mkdir -p .build
          site=$(readlink -f result)
          commit=$(git rev-parse HEAD)
          artifact="unsigned-repository-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "site=$site"
            echo "commit=$commit"
            echo "artifact=$artifact"
          } >> "$GITHUB_OUTPUT"
          echo "$commit" > .build/source-commit
          nix-store --query --requisites "$site" > .build/closure-paths.txt
          mapfile -t paths < .build/closure-paths.txt
          nix-store --export "${paths[@]}" > .build/publication.nar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: |
            .build/source-commit
            .build/publication.nar
            .build/closure-paths.txt
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    if: inputs.publish
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      source_commit: ${{ needs.build.outputs.commit }}
      site: ${{ needs.build.outputs.site }}
      artifact: ${{ needs.build.outputs.artifact }}
